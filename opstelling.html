<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opstelling – JO8-5</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main>
  <div class="sectie-titel" style="margin-top:0">🧩 Opstelling</div>
  <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:14px">Elk kwart heeft een eigen keeper, 5 veldspelers en 2 wissels. Sleep een speler op een andere plek (of op de bank) om te wisselen. Deze opstelling is niet aan een specifieke wedstrijd gekoppeld en wordt lokaal in je browser bewaard.</p>

  <div id="opstelling-inhoud"><div class="leeg-melding">Laden…</div></div>
</main>

<script src="shared.js"></script>
<script>
renderHeader('opstelling');
renderFooter();

// Deze pagina werkt zonder database: de spelers komen uit SPELERS_NAMEN
// (shared.js) en de opstelling wordt lokaal opgeslagen (localStorage),
// niet gekoppeld aan een wedstrijd uit Supabase.
const MAG_BEWERKEN = true;
const LOKALE_OPSLAG_KEY = 'jo85_opstelling_lokaal';

// Vaste veldposities: index 0 = keeper, 1-2 = verdedigers, 3 = middenvelder, 4-5 = aanvallers
// Opstelling 2-1-2: keeper, 2 verdedigers, 1 middenvelder (mid-mid), 2 aanvallers
const POSITIES = [
  { x: 50, y: 90, rol: 'keeper' },
  { x: 28, y: 66 }, { x: 72, y: 66 },   // verdedigers
  { x: 50, y: 44 },                      // middenvelder
  { x: 28, y: 18 }, { x: 72, y: 18 },   // aanvallers
];

const SPELERS = SPELERS_NAMEN.map((naam, i) => ({ id: i + 1, naam, foto_url: null }));
const SPELERS_BY_ID = Object.fromEntries(SPELERS.map(s => [s.id, s]));
let KWART_DATA = {}; // { 1: {spelers:[id x6], wissels:[id x2]}, 2: {...}, 3: {...}, 4: {...} }

function chipHtml(spelerId, kwart, slotType, slotIndex, rol) {
  const s = SPELERS_BY_ID[spelerId];
  if (!s) return '';
  const foto = s.foto_url
    ? `<img class="chip-foto" src="${s.foto_url}" alt="" onerror="this.outerHTML='<div class=chip-avatar>${escapeHtml((s.naam||'?')[0])}</div>'" />`
    : `<div class="chip-avatar">${escapeHtml((s.naam||'?')[0])}</div>`;
  return `
    <div class="speler-chip ${rol==='keeper'?'keeper':''} ${MAG_BEWERKEN?'':'niet-bewerkbaar'}"
         data-kwart="${kwart}" data-slot-type="${slotType}" data-slot-index="${slotIndex}" data-speler-id="${spelerId}">
      ${foto}
      <div class="chip-naam">${escapeHtml(s.naam)}${rol==='keeper' ? ' 🧤' : ''}</div>
    </div>`;
}

function renderKwart(kwart) {
  const data = KWART_DATA[kwart];
  const veldSlots = POSITIES.map((pos, i) => `
    <div class="veld-slot" style="left:${pos.x}%;top:${pos.y}%">
      ${chipHtml(data.spelers[i], kwart, 'veld', i, pos.rol)}
    </div>`).join('');

  const bankChips = data.wissels.map((id, i) => chipHtml(id, kwart, 'bank', i, null)).join('');

  return `
    <div class="kwart-blok" data-kwart-blok="${kwart}">
      <div class="kwart-titel">⏱️ Kwart ${kwart}</div>
      <div class="veld" data-kwart-veld="${kwart}">
        <div class="goal-box"></div>
        ${veldSlots}
      </div>
      <div class="bank-wrap">
        <div class="bank-titel">🔄 Wissels</div>
        <div class="bank-rij" data-kwart-bank="${kwart}">${bankChips}</div>
      </div>
    </div>`;
}

function renderAlleKwarten() {
  const wrap = document.getElementById('opstelling-inhoud');
  let html = `<div class="kwarten-grid">${[1,2,3,4].map(renderKwart).join('')}</div>`;
  if (MAG_BEWERKEN) {
    html += `
      <div style="margin-top:20px;display:flex;align-items:center;gap:12px">
        <button class="btn" id="btn-opslaan-opstelling">💾 Opstelling opslaan</button>
        <button class="btn secundair" id="btn-reset-opstelling">↺ Standaard</button>
        <span id="opslaan-status" style="font-size:0.85rem;color:var(--text-muted)"></span>
      </div>`;
  }
  wrap.innerHTML = html;
  if (MAG_BEWERKEN) {
    document.getElementById('btn-opslaan-opstelling').addEventListener('click', slaOpstellingOp);
    document.getElementById('btn-reset-opstelling').addEventListener('click', () => {
      if (!confirm('Terug naar de standaardindeling? Lokaal opgeslagen wijzigingen gaan verloren.')) return;
      localStorage.removeItem(LOKALE_OPSLAG_KEY);
      KWART_DATA = { 1: standaardKwartData(), 2: standaardKwartData(), 3: standaardKwartData(), 4: standaardKwartData() };
      renderAlleKwarten();
    });
    koppelSleepEvents();
  }
}

// ============ Slepen (pointer events — werkt met muis én touch) ============
let dragState = null; // { spelerId, vanuitKwart, vanuitType, vanuitIndex, ghostEl }

function koppelSleepEvents() {
  document.querySelectorAll('.speler-chip').forEach(chip => {
    chip.addEventListener('pointerdown', onChipPointerDown);
  });
}

function onChipPointerDown(e) {
  const chip = e.currentTarget;
  e.preventDefault();
  const spelerId = parseInt(chip.dataset.spelerId, 10);
  dragState = {
    spelerId,
    kwart: parseInt(chip.dataset.kwart, 10),
    vanuitType: chip.dataset.slotType,
    vanuitIndex: parseInt(chip.dataset.slotIndex, 10),
  };
  chip.classList.add('dragging');

  const ghost = chip.cloneNode(true);
  ghost.classList.remove('dragging');
  ghost.classList.add('sleep-ghost');
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);
  dragState.ghostEl = ghost;
  dragState.bronChip = chip;

  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp, { once: true });
}

function onPointerMove(e) {
  if (!dragState) return;
  dragState.ghostEl.style.left = e.clientX + 'px';
  dragState.ghostEl.style.top = e.clientY + 'px';
}

function onPointerUp(e) {
  window.removeEventListener('pointermove', onPointerMove);
  if (!dragState) return;
  const { spelerId, kwart, vanuitType, vanuitIndex, ghostEl, bronChip } = dragState;
  ghostEl.remove();
  bronChip.classList.remove('dragging');

  // Zoek het element onder de vinger/muis, binnen hetzelfde kwart
  ghostEl.style.display = 'none';
  const onder = document.elementFromPoint(e.clientX, e.clientY);
  dragState = null;
  if (!onder) return;

  const veldEl = onder.closest(`[data-kwart-veld="${kwart}"]`);
  const bankEl = onder.closest(`[data-kwart-bank="${kwart}"]`);

  let doelType = null, doelIndex = null;
  if (veldEl) {
    // Bepaal dichtstbijzijnde veldpositie t.o.v. de dropcoördinaat
    const rect = veldEl.getBoundingClientRect();
    const relX = ((e.clientX - rect.left) / rect.width) * 100;
    const relY = ((e.clientY - rect.top) / rect.height) * 100;
    let besteAfstand = Infinity;
    POSITIES.forEach((pos, i) => {
      const afstand = Math.hypot(pos.x - relX, pos.y - relY);
      if (afstand < besteAfstand) { besteAfstand = afstand; doelIndex = i; }
    });
    doelType = 'veld';
  } else if (bankEl) {
    const chipOnder = onder.closest('.speler-chip');
    doelType = 'bank';
    doelIndex = chipOnder ? parseInt(chipOnder.dataset.slotIndex, 10) : (KWART_DATA[kwart].wissels.length > 0 ? 0 : 0);
  } else {
    return; // buiten een geldig doel losgelaten
  }

  if (doelType === vanuitType && doelIndex === vanuitIndex) return; // zelfde plek

  // Wissel de twee spelers om
  const data = KWART_DATA[kwart];
  const bron = vanuitType === 'veld' ? data.spelers : data.wissels;
  const doel = doelType === 'veld' ? data.spelers : data.wissels;
  const doelSpelerId = doel[doelIndex];
  doel[doelIndex] = spelerId;
  bron[vanuitIndex] = doelSpelerId;

  const wrap = document.getElementById('opstelling-inhoud');
  const blok = wrap.querySelector(`[data-kwart-blok="${kwart}"]`);
  blok.outerHTML = renderKwart(kwart);
  koppelSleepEvents();
}

// ============ Data laden/opslaan (lokaal — geen database) ============
function standaardKwartData() {
  const ids = SPELERS.map(s => s.id);
  return { spelers: ids.slice(0, 6), wissels: ids.slice(6, 8) };
}

function laadOpstellingen() {
  KWART_DATA = { 1: standaardKwartData(), 2: standaardKwartData(), 3: standaardKwartData(), 4: standaardKwartData() };
  try {
    const raw = localStorage.getItem(LOKALE_OPSLAG_KEY);
    if (raw) {
      const opgeslagen = JSON.parse(raw);
      [1, 2, 3, 4].forEach(kwart => {
        const r = opgeslagen[kwart];
        if (r && Array.isArray(r.spelers) && r.spelers.length === 6) {
          KWART_DATA[kwart] = { spelers: r.spelers.slice(), wissels: (r.wissels || []).slice() };
        }
      });
    }
  } catch (e) { /* val terug op standaardindeling */ }

  renderAlleKwarten();
}

function slaOpstellingOp() {
  const status = document.getElementById('opslaan-status');
  try {
    localStorage.setItem(LOKALE_OPSLAG_KEY, JSON.stringify(KWART_DATA));
    status.textContent = '✓ Opgeslagen op dit apparaat!';
    setTimeout(() => { status.textContent = ''; }, 2500);
  } catch (e) {
    status.textContent = 'Opslaan mislukt.';
  }
}

laadOpstellingen();
</script>
</body>
</html>
